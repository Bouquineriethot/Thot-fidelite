<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2D4F3E" />
  <title>Fidélité — Bouquinerie Thot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { thot: { cream: "#FAF6F0", forest: "#2D4F3E", gold: "#B8860B", ink: "#1F2933" } } } } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-thot-cream text-thot-ink antialiased min-h-screen">
  <div id="app" class="mx-auto max-w-xl px-4 pb-12 pt-6">
    <p class="text-center text-sm text-gray-500 mt-10">Chargement...</p>
  </div>
  <script>
    const SUPABASE_URL = "https://obokcfdxraixkzekgjum.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hN4pQyzif0bM0jjIw0HGZg_OjOeTb8l";
    const appEl = document.getElementById("app");
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let state = { customer: null, staffMode: true, emailSent: false, lastEmail: "", msg: null, err: null, selected: null, searchQuery: "", qrScanner: null, scanning: false, rewards: [], vouchers: [] };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const qrSvg = (txt, px = 86) => { const q = window.qrcode(0, "M"); q.addData(txt); q.make(); return q.createSvgTag({ scalable: true }).replace("<svg ", `<svg style="width:${px}px;height:${px}px" `); };

    const headerHtml = () => {
      const c = state.customer;
      return `<header class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-thot-forest text-white font-serif font-bold text-lg">T</div>
          <div><h1 class="font-serif text-lg font-bold leading-tight">Bouquinerie Thot</h1><p class="text-xs text-gray-500">Fidélité • Bollezeele</p></div>
        </div>
        ${c ? `<div class="flex items-center gap-2">
          ${c.role === "staff" ? `<button onclick="toggleMode()" class="rounded-lg border border-thot-forest px-2.5 py-1 text-xs font-bold text-thot-forest">${state.staffMode ? "Vue Client" : "Vue Caisse"}</button>` : ""}
          <button onclick="logout()" class="rounded-lg border border-stone-300 px-2.5 py-1 text-xs text-gray-600">Quitter</button>
        </div>` : ""}
      </header>`;
    };

    const flashHtml = () => (state.msg ? `<div class="mb-4 rounded-xl border border-emerald-300 bg-emerald-50 p-3 text-sm text-emerald-900">${esc(state.msg)}</div>` : "") +
      (state.err ? `<div class="mb-4 rounded-xl border border-red-300 bg-red-50 p-3 text-sm text-red-800">${esc(state.err)}</div>` : "");

    function renderLogin() {
      appEl.innerHTML = headerHtml() + flashHtml() + `<div class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm">
        <h2 class="font-serif text-xl font-bold">Mon compte fidélité</h2>
        <p class="mt-1 text-sm text-gray-500">Entrez l'e-mail donné en boutique pour voir vos points.</p>
        ${state.emailSent ? `<div class="mt-4 rounded-xl bg-emerald-50 p-4 text-sm text-emerald-900">
          <p class="font-bold">Lien envoyé !</p><p class="mt-1">Ouvrez votre boîte mail (<strong>${esc(state.lastEmail)}</strong>) et cliquez sur le lien reçu (vérifiez les spams).</p>
          <button onclick="resetLogin()" class="mt-3 text-xs underline text-thot-forest">Changer d'e-mail</button></div>`
        : `<form onsubmit="sendLink(event)" class="mt-4 space-y-3">
          <input id="login-email" type="email" required placeholder="votre@email.fr" class="w-full rounded-xl border border-stone-300 p-3 text-sm" />
          <button type="submit" class="w-full rounded-xl bg-thot-forest py-3 text-sm font-bold text-white">Recevoir mon lien</button>
        </form>`}
      </div>`;
    }

    async function renderCustomer() {
      const c = state.customer;
      const [{ data: rewards }, { data: vouchers }, { data: txs }] = await Promise.all([
        sb.from("rewards").select("*").eq("active", true).order("points_cost"),
        sb.from("vouchers").select("*").eq("customer_id", c.id).eq("status", "active").order("created_at", { ascending: false }),
        sb.from("transactions").select("*").eq("customer_id", c.id).order("created_at", { ascending: false }).limit(15)
      ]);
      state.rewards = rewards || [];
      const next = state.rewards.find((r) => r.points_cost > c.points);
      const pct = next ? Math.min(100, (c.points / next.points_cost) * 100) : 100;

      appEl.innerHTML = headerHtml() + flashHtml() + `<div class="space-y-6">
        <div class="rounded-2xl bg-thot-forest p-6 text-white shadow-lg">
          <div class="flex items-start justify-between gap-4">
            <div><p class="text-xs uppercase tracking-widest text-emerald-200">Bouquinerie Thot</p>
              <h2 class="mt-1 font-serif text-xl font-bold">${esc(c.full_name)}</h2>
              <p class="mt-3 text-4xl font-extrabold text-amber-300">${c.points} <span class="text-base font-normal text-white">pts</span></p>
              <p class="mt-1 text-xs text-emerald-100">1 € dépensé = 1 point</p></div>
            <div class="rounded-xl bg-white p-2 text-center">${qrSvg(c.card_code, 84)}<p class="mt-1 font-mono text-[10px] font-bold text-thot-ink">${esc(c.card_code)}</p></div>
          </div>
          ${next ? `<div class="mt-5"><div class="flex justify-between text-xs text-emerald-100"><span>Prochain palier : ${esc(next.title)}</span><span>${c.points} / ${next.points_cost} pts</span></div>
            <div class="mt-1.5 h-2 overflow-hidden rounded-full bg-emerald-900"><div class="h-full bg-amber-400" style="width:${pct}%"></div></div></div>` : ""}
        </div>
        ${vouchers && vouchers.length ? `<section class="space-y-2"><h3 class="font-serif text-lg font-bold">Mes bons en caisse</h3>
          ${vouchers.map((v) => `<div class="flex items-center justify-between rounded-xl border-2 border-dashed border-thot-gold bg-white p-4">
            <div><p class="font-bold text-thot-forest">${esc(v.reward_title)}</p><p class="font-mono text-xs text-gray-500">${esc(v.code)}</p></div>${qrSvg(v.code, 64)}
          </div>`).join("")}</section>` : ""}
        <section class="space-y-2"><h3 class="font-serif text-lg font-bold">Échanger mes points</h3>
          ${state.rewards.map((r) => { const ok = c.points >= r.points_cost; return `<div class="flex items-center justify-between gap-4 rounded-xl border border-stone-200 bg-white p-4">
            <div><p class="font-bold">${esc(r.title)}</p><p class="text-xs text-gray-500">${esc(r.description || "")}</p><p class="mt-1 text-xs font-semibold text-thot-forest">${r.points_cost} points</p></div>
            <button ${ok ? `onclick="redeemReward('${r.id}')"` : "disabled"} class="shrink-0 rounded-lg px-4 py-2 text-xs font-bold ${ok ? "bg-thot-forest text-white" : "bg-stone-100 text-stone-400"}">${ok ? "Échanger" : "Insuffisant"}</button>
          </div>`; }).join("")}
        </section>
        <section class="space-y-2"><h3 class="font-serif text-lg font-bold">Historique</h3>
          <div class="divide-y divide-stone-100 rounded-xl border border-stone-200 bg-white">
            ${!txs || !txs.length ? `<p class="p-4 text-sm text-gray-500">Aucun mouvement.</p>` : txs.map((t) => `<div class="flex items-center justify-between px-4 py-3 text-sm">
              <div><p class="font-medium">${esc(t.reason)}</p><p class="text-xs text-gray-400">${new Date(t.created_at).toLocaleDateString("fr-FR")}</p></div>
              <span class="font-bold ${t.points_delta >= 0 ? "text-emerald-700" : "text-amber-700"}">${t.points_delta >= 0 ? "+" + t.points_delta : t.points_delta} pts</span>
            </div>`).join("")}
          </div>
        </section>
      </div>`;
    }

    async function renderStaff() {
      const q = state.searchQuery.trim();
      let req = sb.from("customers").select("*").order("created_at", { ascending: false }).limit(15);
      if (q) req = sb.from("customers").select("*").or(`full_name.ilike.%${q}%,email.ilike.%${q}%,card_code.ilike.%${q}%,phone.ilike.%${q}%`).limit(15);
      const { data: list } = await req;
      state.vouchers = [];
      if (state.selected) {
        const { data: v } = await sb.from("vouchers").select("*").eq("customer_id", state.selected.id).eq("status", "active");
        state.vouchers = v || [];
      }

      appEl.innerHTML = headerHtml() + flashHtml() + `<div class="space-y-5">
        <div class="flex flex-wrap gap-2">
          <button onclick="toggleScan()" class="rounded-xl bg-thot-forest px-4 py-2.5 text-sm font-bold text-white">${state.scanning ? "Fermer caméra" : "📷 Scanner QR"}</button>
          <button onclick="toggleNewForm()" class="rounded-xl border border-thot-forest bg-white px-4 py-2.5 text-sm font-bold text-thot-forest">+ Nouveau client</button>
          <label class="cursor-pointer rounded-xl border border-stone-300 bg-white px-4 py-2.5 text-sm font-medium text-stone-700">📄 Importer CSV<input type="file" accept=".csv" onchange="importCsv(event)" class="hidden" /></label>
        </div>
        <div class="${state.scanning ? "" : "hidden"} rounded-xl overflow-hidden bg-black p-2"><div id="qr-reader" class="mx-auto max-w-sm"></div></div>
        <form id="new-client-form" onsubmit="createClient(event)" class="hidden space-y-3 rounded-xl border bg-white p-4">
          <h3 class="font-bold">Nouveau client</h3>
          <input id="nc-name" required placeholder="Nom et prénom *" class="w-full rounded-lg border p-2 text-sm" />
          <input id="nc-email" type="email" placeholder="E-mail" class="w-full rounded-lg border p-2 text-sm" />
          <input id="nc-phone" placeholder="Téléphone" class="w-full rounded-lg border p-2 text-sm" />
          <button class="rounded-lg bg-thot-forest px-4 py-2 text-sm font-bold text-white">Créer</button>
        </form>
        ${state.selected ? `<div class="space-y-4 rounded-2xl border-2 border-thot-forest bg-white p-5 shadow-md">
          <div class="flex justify-between items-start">
            <div><h3 class="font-serif text-xl font-bold">${esc(state.selected.full_name)}</h3>
              <p class="text-xs text-gray-500">${esc(state.selected.email || state.selected.phone || state.selected.card_code)}</p>
              <p class="mt-2 text-2xl font-extrabold text-thot-forest">${state.selected.points} points</p></div>
            <button onclick="clearSelected()" class="text-sm text-gray-400 px-2">✕</button>
          </div>
          ${state.vouchers.length ? `<div class="space-y-2 rounded-xl bg-amber-50 p-3">
            <p class="text-xs font-bold uppercase text-amber-800">Bons à valider :</p>
            ${state.vouchers.map((v) => `<div class="flex items-center justify-between gap-2">
              <span class="text-sm font-semibold">${esc(v.reward_title)} (${esc(v.code)})</span>
              <button onclick="useVoucher('${v.id}')" class="rounded-lg bg-amber-600 px-3 py-1.5 text-xs font-bold text-white">Valider</button>
            </div>`).join("")}</div>` : ""}
          <form onsubmit="addPoints(event)" class="flex flex-wrap gap-2">
            <input id="pts-euros" type="text" inputmode="decimal" required placeholder="Montant € (1€=1pt)" class="w-40 rounded-lg border p-2 text-sm" />
            <input id="pts-reason" type="text" value="Achat boutique" class="flex-1 min-w-[130px] rounded-lg border p-2 text-sm" />
            <button class="rounded-lg bg-thot-forest px-4 py-2 text-sm font-bold text-white">Créditer</button>
          </form>
        </div>` : ""}
        <div class="space-y-2">
          <input id="search-input" placeholder="Chercher nom, e-mail, tél ou code..." value="${esc(state.searchQuery)}" oninput="onSearch(this.value)" class="w-full rounded-xl border border-stone-200 bg-white p-2.5 text-sm" />
          <div class="divide-y divide-stone-100 rounded-xl border border-stone-200 bg-white">
            ${(list || []).map((c) => `<button onclick="selectCust('${c.id}')" class="flex w-full items-center justify-between px-4 py-3 text-left hover:bg-stone-50">
              <div><p class="font-semibold">${esc(c.full_name)}</p><p class="text-xs text-gray-500">${esc(c.email || c.phone || c.card_code)}</p></div>
              <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-thot-forest">${c.points} pts</span>
            </button>`).join("")}
          </div>
        </div>
      </div>`;
      const si = document.getElementById("search-input");
      if (si && state.searchQuery) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
    }

    async function render() {
      try {
        if (!state.customer) return renderLogin();
        if (state.customer.role === "staff" && state.staffMode) return await renderStaff();
        return await renderCustomer();
      } catch (e) { appEl.innerHTML = `<div class="p-4 bg-red-50 text-red-800 rounded-xl text-sm">Erreur : ${esc(e.message)}</div>`; }
    }

    async function loadProfile() {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { state.customer = null; return render(); }
        const { data } = await sb.from("customers").select("*").eq("auth_user_id", user.id).single();
        state.customer = data || null;
        render();
      } catch (e) { appEl.innerHTML = `<div class="p-4 bg-red-50 text-red-800 rounded-xl text-sm">Erreur connexion : ${esc(e.message)}</div>`; }
    }

    window.sendLink = async (e) => {
      e.preventDefault(); state.err = null;
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href.split("#")[0].split("?")[0] } });
      if (error) state.err = error.message; else { state.emailSent = true; state.lastEmail = email; }
      render();
    };
    window.resetLogin = () => { state.emailSent = false; state.err = null; render(); };
    window.logout = async () => { await sb.auth.signOut(); state.customer = null; state.selected = null; render(); };
    window.toggleMode = () => { state.staffMode = !state.staffMode; state.msg = null; state.err = null; render(); };
    window.redeemReward = async (id) => {
      const r = state.rewards.find((x) => x.id === id);
      if (!r || !confirm(`Échanger ${r.points_cost} pts contre "${r.title}" ?`)) return;
      state.msg = null; state.err = null;
      const { error } = await sb.rpc("redeem_reward", { p_reward_id: id });
      if (error) state.err = error.message; else state.msg = `Bon "${r.title}" généré ! Présentez-le en caisse.`;
      await loadProfile();
    };
    window.onSearch = (val) => { state.searchQuery = val; renderStaff(); };
    window.selectCust = async (id) => {
      const { data } = await sb.from("customers").select("*").eq("id", id).single();
      state.selected = data; state.msg = null; state.err = null; render();
    };
    window.clearSelected = () => { state.selected = null; render(); };
    window.toggleNewForm = () => document.getElementById("new-client-form").classList.toggle("hidden");
    window.createClient = async (e) => {
      e.preventDefault();
      const code = "THOT-" + Math.random().toString(36).substring(2, 8).toUpperCase();
      const { data, error } = await sb.from("customers").insert({
        full_name: document.getElementById("nc-name").value.trim(),
        email: document.getElementById("nc-email").value.trim().toLowerCase() || null,
        phone: document.getElementById("nc-phone").value.trim() || null,
        card_code: code, points: 0
      }).select().single();
      if (error) state.err = error.message; else { state.selected = data; state.msg = "Client créé !"; }
      render();
    };
    window.addPoints = async (e) => {
      e.preventDefault();
      const pts = Math.floor(parseFloat(document.getElementById("pts-euros").value.replace(",", ".")));
      const reason = document.getElementById("pts-reason").value;
      if (isNaN(pts) || pts === 0) return;
      const { data: total, error } = await sb.rpc("staff_add_points", { p_customer_id: state.selected.id, p_points: pts, p_reason: reason });
      if (error) state.err = error.message; else { state.selected.points = total; state.msg = `${pts > 0 ? "+" : ""}${pts} pts enregistrés !`; }
      render();
    };
    window.useVoucher = async (id) => {
      const v = state.vouchers.find((x) => x.id === id);
      if (!v || !confirm(`Valider "${v.reward_title}" ?`)) return;
      const { error } = await sb.rpc("staff_use_voucher", { p_voucher_id: id });
      if (error) state.err = error.message; else state.msg = `Bon "${v.reward_title}" validé !`;
      render();
    };
    window.importCsv = (e) => {
      const file = e.target.files?.[0]; if (!file) return;
      window.Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: async (res) => {
          const rows = res.data.map((row) => {
            const get = (keys) => { const k = Object.keys(row).find((c) => keys.some((t) => c.toLowerCase().includes(t))); return k ? row[k] : ""; };
            return { full_name: get(["nom", "name", "client", "prenom", "prénom"]), email: get(["mail", "courriel"]), phone: get(["tel", "tél", "phone", "mobile"]), points: parseInt(get(["point", "pts", "solde"]) || "0", 10) || 0 };
          });
          const { data: count, error } = await sb.rpc("staff_import_customers", { p_rows: rows });
          if (error) state.err = "Erreur import : " + error.message; else state.msg = `${count} comptes importés / mis à jour !`;
          render();
        }
      });
    };
    window.toggleScan = async () => {
      if (state.scanning && state.qrScanner) { await state.qrScanner.stop().catch(() => {}); state.scanning = false; return render(); }
      state.scanning = true; await render();
      const scanner = new window.Html5Qrcode("qr-reader"); state.qrScanner = scanner;
      scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } }, async (txt) => {
        await scanner.stop().catch(() => {}); state.scanning = false;
        const code = txt.trim().toUpperCase();
        if (code.startsWith("BON-")) {
          const { data: v } = await sb.from("vouchers").select("*").eq("code", code).single();
          if (v) { const { data: c } = await sb.from("customers").select("*").eq("id", v.customer_id).single(); state.selected = c || null; }
          else state.err = `Bon ${code} introuvable.`;
        } else {
          const { data: c } = await sb.from("customers").select("*").eq("card_code", code).single();
          if (c) state.selected = c; else state.err = `Carte ${code} introuvable.`;
        }
        render();
      }, () => {}).catch(() => { state.scanning = false; state.err = "Caméra refusée ou indisponible."; render(); });
    };

    sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") loadProfile(); });
    loadProfile();
  </script>
</body>
</html>
