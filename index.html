<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2D4F3E" />
  <title>Fidélité — Bouquinerie Thot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{thot:{cream:"#FAF6F0",forest:"#2D4F3E",gold:"#B8860B",ink:"#1F2933"}}}}};</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-thot-cream text-thot-ink antialiased min-h-screen">
  <div id="app" class="mx-auto max-w-xl px-4 pb-12 pt-6"><p class="text-center text-sm text-gray-500 mt-10">Chargement...</p></div>
  <script>
    const sb = window.supabase.createClient("https://obokcfdxraixkzekgjum.supabase.co", "sb_publishable_hN4pQyzif0bM0jjIw0HGZg_OjOeTb8l", { auth: { persistSession: true } });
    const appEl = document.getElementById("app");
    let state = { customer: null, staffMode: true, authTab: "login", showSecret: false, msg: null, err: null, selected: null, searchQuery: "", qrScanner: null, scanning: false, rewards: [], vouchers: [] };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const qrSvg = (t, px = 86) => { const q = window.qrcode(0, "M"); q.addData(t); q.make(); return q.createSvgTag({ scalable: true }).replace("<svg ", `<svg style="width:${px}px;height:${px}px" `); };

    function frError(m) {
      if (!m) return "Une erreur est survenue.";
      const s = m.toLowerCase();
      if (s.includes("invalid login credentials")) return "E-mail ou identifiant incorrect.";
      if (s.includes("already registered")) return "Cet e-mail possède déjà un code. Cliquez sur « J'ai déjà un code ».";
      if (s.includes("email not confirmed")) return "Désactivez « Confirm email » dans Supabase.";
      return m;
    }
    const headerHtml = () => {
      const c = state.customer;
      return `<header class="mb-6 flex items-center justify-between"><div class="flex items-center gap-2.5"><div class="flex h-10 w-10 items-center justify-center rounded-xl bg-thot-forest text-white font-serif font-bold text-lg">T</div><div><h1 class="font-serif text-lg font-bold leading-tight">Bouquinerie Thot</h1><p class="text-xs text-gray-500">Fidélité • Bollezeele</p></div></div>${c ? `<div class="flex items-center gap-2">${c.role === "staff" ? `<button onclick="toggleMode()" class="rounded-lg border border-thot-forest px-2.5 py-1 text-xs font-bold text-thot-forest">${state.staffMode ? "Vue Client" : "Vue Caisse"}</button>` : ""}<button onclick="logout()" class="rounded-lg border border-stone-300 px-2.5 py-1 text-xs text-gray-600">Quitter</button></div>` : ""}</header>`;
    };
    const flashHtml = () => (state.msg ? `<div class="mb-4 rounded-xl border border-emerald-300 bg-emerald-50 p-3 text-sm text-emerald-900">${esc(state.msg)}</div>` : "") + (state.err ? `<div class="mb-4 rounded-xl border border-red-300 bg-red-50 p-3 text-sm text-red-800">${esc(state.err)}</div>` : "");

    function renderLogin() {
      const t = state.authTab;
      if (t === "staff") {
        appEl.innerHTML = headerHtml() + flashHtml() + `<div class="rounded-2xl border-2 border-thot-forest bg-white p-6 shadow-sm"><h2 class="font-serif text-xl font-bold text-thot-forest">🔒 Accès Caisse (Libraire)</h2><p class="mt-1 text-xs text-gray-500">Espace réservé à la Bouquinerie Thot.</p><form onsubmit="submitAuth(event)" class="mt-4 space-y-3"><input id="login-email" type="email" required placeholder="E-mail libraire" class="w-full rounded-xl border p-3 text-sm" /><div class="flex justify-end"><button type="button" onclick="toggleShow()" class="text-xs text-thot-forest underline">${state.showSecret ? "Masquer" : "Afficher"}</button></div><input id="login-secret" type="${state.showSecret ? "text" : "password"}" required placeholder="Mot de passe sécurisé" class="w-full rounded-xl border p-3 text-sm" /><button type="submit" class="w-full rounded-xl bg-thot-forest py-3 text-sm font-bold text-white">Ouvrir la caisse</button></form><button type="button" onclick="setTab('login')" class="mt-4 w-full text-center text-xs text-gray-500 underline">← Retour client</button></div>`;
        return;
      }
      const up = t === "signup";
      appEl.innerHTML = headerHtml() + flashHtml() + `<div class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm"><div class="grid grid-cols-2 gap-2 rounded-xl bg-stone-100 p-1 mb-5"><button type="button" onclick="setTab('login')" class="rounded-lg py-2 text-xs font-bold ${!up ? "bg-white text-thot-forest shadow-sm" : "text-gray-500"}">J'ai déjà un code</button><button type="button" onclick="setTab('signup')" class="rounded-lg py-2 text-xs font-bold ${up ? "bg-white text-thot-forest shadow-sm" : "text-gray-500"}">Première visite</button></div><h2 class="font-serif text-xl font-bold">${up ? "Créer mon code à 4 chiffres" : "Accéder à mes points"}</h2><form onsubmit="submitAuth(event)" class="mt-4 space-y-3">${up ? `<input id="login-name" type="text" required placeholder="Nom et prénom" class="w-full rounded-xl border p-3 text-sm" />` : ""}<input id="login-email" type="email" required placeholder="Votre adresse e-mail" class="w-full rounded-xl border p-3 text-sm" /><div class="flex justify-between items-center"><span class="text-xs text-gray-500">Code à 4 chiffres</span><button type="button" onclick="toggleShow()" class="text-xs text-thot-forest underline">${state.showSecret ? "Masquer" : "Afficher"}</button></div><input id="login-secret" type="${state.showSecret ? "text" : "password"}" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="••••" class="w-full rounded-xl border p-3 text-center font-mono text-lg tracking-widest" /><button type="submit" class="w-full rounded-xl bg-thot-forest py-3 text-sm font-bold text-white">${up ? "Créer mon code" : "Me connecter"}</button></form></div><div class="mt-6 text-center"><button type="button" onclick="setTab('staff')" class="text-xs text-gray-400 underline">🔒 Accès Caisse (Libraire)</button></div>`;
    }
    async function render() {
      if (!state.customer) return renderLogin();
      if (state.customer.role === "staff" && state.staffMode) return await window.renderStaff();
      return await window.renderCustomer();
    }
    async function loadProfile() {
      const { data: { session }, error: se } = await sb.auth.getSession();
      if (se) { state.err = frError(se.message); state.customer = null; return render(); }
      if (!session?.user) { state.customer = null; return render(); }
      const { data, error } = await sb.from("customers").select("*").eq("auth_user_id", session.user.id).maybeSingle();
      if (error || !data) { appEl.innerHTML = headerHtml() + `<div class="p-4 bg-red-50 rounded-xl text-sm text-red-800">${esc(error?.message || "Fiche absente.")} <button onclick="logout()" class="underline ml-2">Quitter</button></div>`; return; }
      if (state.authTab === "staff" && data.role !== "staff") { await sb.auth.signOut(); state.customer = null; state.err = "Accès refusé : ce compte n'est pas libraire."; return render(); }
      state.customer = data; render();
    }
    window.setTab = (t) => { state.authTab = t; state.showSecret = false; state.err = null; state.msg = null; render(); };
    window.toggleShow = () => { const s = document.getElementById("login-secret")?.value || "", e = document.getElementById("login-email")?.value || "", n = document.getElementById("login-name")?.value || ""; state.showSecret = !state.showSecret; render(); if (document.getElementById("login-email")) document.getElementById("login-email").value = e; if (document.getElementById("login-secret")) document.getElementById("login-secret").value = s; if (document.getElementById("login-name")) document.getElementById("login-name").value = n; };
    window.submitAuth = async (e) => {
      e.preventDefault(); state.err = null; state.msg = null;
      const email = document.getElementById("login-email").value.trim().toLowerCase(), sec = document.getElementById("login-secret").value;
      if (state.authTab === "staff") { const { error } = await sb.auth.signInWithPassword({ email, password: sec }); if (error) { state.err = frError(error.message); return render(); } return await loadProfile(); }
      const pin = sec.trim(); if (!/^\d{4}$/.test(pin)) { state.err = "Le code client doit faire exactement 4 chiffres."; return render(); }
      const pwd = "THOT-PIN-" + pin;
      if (state.authTab === "signup") { const nm = document.getElementById("login-name").value.trim(); const { error } = await sb.auth.signUp({ email, password: pwd, options: { data: { full_name: nm } } }); if (error) { state.err = frError(error.message); return render(); } }
      else { const { error } = await sb.auth.signInWithPassword({ email, password: pwd }); if (error) { state.err = frError(error.message); return render(); } }
      await loadProfile();
    };
    window.logout = async () => { await sb.auth.signOut(); state.customer = null; state.selected = null; render(); };
    window.toggleMode = () => { state.staffMode = !state.staffMode; state.msg = null; state.err = null; render(); };
  </script>
  <script src="./client.js"></script>
  <script src="./caisse.js"></script>
  <script>sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") loadProfile(); }); loadProfile();</script>
</body>
</html>
